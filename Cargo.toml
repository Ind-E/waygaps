[package]
name = "waygaps"
version = "0.1.0"
edition = "2024"

[dependencies]
hashbrown = { version = "=0.16.1", default-features = false }
input-event-codes = "6.2.0"
nu-ansi-term = { version = "0.50.3", default-features = false }
origin = { version = "0.26.2", default-features = false, features = [
    "origin-start",
    "nightly",
    "signal",
] }
regex = { version = "1.12.2", default-features = false }
rustc-hash = { version = "2.1.1", default-features = false }
rustix = { version = "1.1.3", default-features = false, features = [
    "alloc",
    "event",
    "pipe",
    "process",
    "shm",
    "stdio",
] }
serde = { version = "1.0.228", default-features = false, features = [
    "alloc",
    "derive",
] }
talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }
toml = { version = "0.9.11", default-features = false, features = ["serde", "parse"] }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "alloc",
] }
waybackend = "0.10.0"

[build-dependencies]
waybackend-scanner = { version = "0.10.0", features = ["build-script"] }

# because nix doesn't play nice with std aware cargo
libc = { version = "=0.2.178", optional = true }
rustc-literal-escaper = { version = "=0.0.7", optional = true }
cfg-if = { version = "=1.0.4", optional = true }
hashbrown = { version = "=0.16.1", optional = true }
rustc-demangle = { version = "=0.1.27", optional = true }
object = { version = "=0.37.3", optional = true }
wasi = { version = "=0.11.1", optional = true }
wasi_1 = { version = "=0.14.4", optional = true, package = "wasi" }
dlmalloc = { version = "=0.2.11", optional = true }
addr2line = { version = "=0.25.1", optional = true }
hermit-abi = { version = "=0.5.2", optional = true }
moto-rt = { version = "=0.16.0", optional = true }
r-efi = { version = "=5.3.0", optional = true }
r-efi-alloc = { version = "=2.1.0", optional = true }
vex-sdk = { version = "=0.27.1", optional = true }
fortanix-sgx-abi = { version = "0.6.1", optional = true }
getopts = { version = "=0.2.24", optional = true }
memchr = { version = "=2.7.6", optional = true }

[profile.release]
lto = true
codegen-units = 1
# strip = true
