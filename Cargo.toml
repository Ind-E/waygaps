[package]
name = "waygaps"
version = "0.1.0"
edition = "2024"

[dependencies]
origin = { version = "0.26.2", default-features = false, features = [
    "origin-start",
    "signal",
] }
rustix = { version = "1.1.3", default-features = false, features = [
    "event",
    "pipe",
    "runtime",
    "stdio",
    "termios",
] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
smallvec = { version = "1.15.1", default-features = false }
talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }
toml = { version = "0.9.11", default-features = false, features = [
    "parse",
    "serde",
] }
waybackend = { version = "0.10.0", default-features = false }

[build-dependencies]
waybackend-scanner = { version = "0.10.0", features = ["build-script"] }


[profile.release]
lto = true
codegen-units = 1
strip = true
