[package]
name = "waygaps"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
knus = "3.3.1"
regex = "1.12.2"
rustix = { version = "1.1.3", features = ["pipe"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
waybackend = "0.10.0"

[build-dependencies]
waybackend-scanner = { version = "0.10.0", features = ["build-script"] }
