cargo-features = ["profile-rustflags"]

[package]
name = "waygaps"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ind-E/waygaps"
description = "Configurable hot corners and hot edges for wayland"
keywords = ["wayland"]
categories = ["command-line-utilities", "no-std"]

[features]
schema = ["dep:schemars", "dep:serde_json"]

[dependencies]
origin = { version = "0.26.2", default-features = false, features = [
    "origin-start",
    "signal",
] }
rustix = { version = "1.1.3", default-features = false, features = [
    "event",
    "mm",
    "runtime",
    "stdio",
    "termios",
] }
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "alloc",
] }
smallvec = { version = "1.15.1", default-features = false, features = [
    "union",
] }
talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }
toml = { version = "1.0.3", default-features = false, features = [
    "serde",
    "parse",
] }
waybackend = { version = "0.10.0", default-features = false }

schemars = { version = "1.2.1", default-features = false, features = [
    "derive",
], optional = true }
serde_json = { version = "1.0.149", default-features = false, features = [
    "alloc",
], optional = true }

[build-dependencies]
waybackend-scanner = { version = "0.10.0", features = ["build-script"] }

# hack to make nix vendor deps correctly
[dev-dependencies]
addr2line = "=0.25.1"
cfg-if = "=1.0.4"
dlmalloc = "=0.2.11"
fortanix-sgx-abi = "0.6.1"
getopts = "=0.2.24"
hashbrown = "=0.16.1"
hermit-abi = "=0.5.2"
libc = "=0.2.178"
memchr = "=2.7.6"
moto-rt = "=0.16.0"
object = "=0.37.3"
r-efi = "=5.3.0"
r-efi-alloc = "=2.1.0"
rustc-demangle = "=0.1.27"
rustc-literal-escaper = "=0.0.7"
unwinding = "=0.2.8"
vex-sdk = "=0.27.1"
wasi = "=0.11.1"
wasi_1 = { version = "=0.14.4", package = "wasi" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
rustflags = [
    "-C",
    "target-cpu=native",
    "-Z",
    "location-detail=none",
    "-Z",
    "fmt-debug=none",
]
